version: 2

models:
  - name: mart_merchant_performance
    description: "Aggregated merchant KPIs including total revenue, total transactions, failed count, failure rate, average transaction value, and unique customers."
    columns:
      - name: merchant_id
        description: "Unique identifier for the merchant"
        tests:
          - not_null
      - name: merchant_name
        description: "Name of the merchant"
        tests:
          - not_null
      - name: category
        description: "Category of the merchant"
      - name: city
        description: "HQ city of the merchant"
      - name: total_transactions
        description: "Total transactions for this merchant"
        tests:
          - not_null
      - name: unique_customers
        description: "Number of unique customers who made transactions"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue from completed transactions"
        tests:
          - not_null
      - name: failed_count
        description: "Number of failed transactions"
        tests:
          - not_null
      - name: failure_rate_pct
        description: "Failure rate percentage of transactions"
        tests:
          - not_null
      - name: avg_transaction_value
        description: "Average value of completed transactions"
        tests:
          - not_null
