version: 2

sources:
  - name: sigma_analytics
    database: SIGMA_DE
    schema: PUBLIC
    tables:
      - name: fact_transactions
      - name: dim_merchant
      - name: dim_customer

models:
  - name: stg_transactions
    description: "Cleaned and prepared transaction data from fact_transactions"
    columns:
      - name: transaction_id
        description: "Unique identifier for each transaction"
        tests:
          - unique
          - not_null
      - name: amount
        description: "Transaction amount in USD"
        tests:
          - not_null
      - name: status
        description: "Status of the transaction (completed, failed, pending)"
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'failed', 'pending']
      - name: merchant_id
        description: "Unique identifier for the merchant"
        tests:
          - not_null
      - name: customer_id
        description: "Unique identifier for the customer"
        tests:
          - not_null
      - name: transaction_date
        description: "Date of the transaction"
        tests:
          - not_null
      - name: payment_method
        description: "Payment method used (credit_card, debit_card, upi)"
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'debit_card', 'upi']
